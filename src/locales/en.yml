name: YouTube Comment Block
description: block comment for Videos/Shorts/LiveChat
format:
  date: MM/DD/YY
  time: HH:mm:ss
dialog:
  button:
    submit: Submit
    delete: Delete
userOption:
  enabled: Hide video comments
  enabledChat: Hide chat messages
  useShowOnHover: Show hidden chats on hover
  useNormalize: Ignore differences between Hiragana and Katakana
  useCaseInsensitive: Ignore differences between uppercase and lowercase letters
  useTemporaryWordSensitive: Temporarily hide users who use ignore words
  useWordSensitive: Hide users who use ignore words
  useTemporaryMentionSensitive: Temporarily hide users who mention ignore users
  useMentionSensitive: Hide users who mention ignore users
